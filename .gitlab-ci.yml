# ============================================================================
# Isolated CI — every pipeline tests THE COMMIT, never the work laptop.
#
#   image  → builds the Dev_lab container image once, caches it in the GitLab
#            Container Registry. Rebuilt only when the Dockerfile / boot
#            scripts / this file change (also manually via FORCE_IMAGE_BUILD).
#   test   → boots a FRESH disposable container from that image with the
#            checked-out commit mounted as its live /var/www volume. Docker
#            socket from the DinD sidecar is injected as /var/docker.sock so
#            labsctl can talk to the same ephemeral daemon. env.json is not in
#            git (secrets) — it comes from the ENV_JSON file variable, with
#            database_file rewritten to the container's own mongod
#            (init-services.sh bootstraps that user from mongo_user/mongo_pass).
#   build  → frontend build in the node:20 image against the commit.
#   deploy → unchanged: still runs on the laptop runner (it can only copy to
#            /Users/sathish/Downloads/TomCloudLab).
#
# One-time setup (GitLab → Settings → CI/CD → Variables):
#   ENV_JSON (File)     — paste the local env.json contents. Only the test job
#                         needs it; never committed, redacted from job logs.
#   FORCE_IMAGE_BUILD   — optional "true" to trigger the image job by hand.
# The image/test jobs need a runner whose Docker executor is configured with
# privileged = true (gitlab.com shared runners already are; a self-hosted
# default runner must set it in config.toml).
# ============================================================================

stages:
  - scan
  - image
  - test
  - build
  - deploy

scan:
  stage: scan
  tags:
    - shared
  only:
    refs:
      - master
      - merge_requests
  script:
    # 1. Clean out heavy, non-source directories to optimize gitleaks speed
    - rm -rf labsstorage/ vendor/ vpn-api/vendor/ backups/ node_modules/
    # 2. Install curl and download gitleaks binary from GitHub releases
    - apt-get update -qq && apt-get install -y -qq curl tar
    - curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /usr/local/bin
    # 3. Run gitleaks on current source tree only (no git history scan)
    - gitleaks detect --source . --no-git --redact --report-path /tmp/gitlab-gitleaks.json
  allow_failure: false

docker_probe:
  # Manual diagnostic: what docker access does the instance runner really have?
  # Run it during the pipeline if docker jobs fail to connect to a daemon.
  stage: image
  image: docker:cli
  when: manual
  allow_failure: true
  script:
    - |
      echo '--- docker env vars ---'
      env | grep -iE 'docker|ci_registry' || true
      echo '--- probe default docker socket (DOCKER_HOST unset) ---'
      unset DOCKER_HOST
      ls -l /var/run/docker.sock 2>&1 || true
      docker info 2>&1 | grep -E 'Server Version|Operating System|ERROR|error' || true
      echo '--- probe dind service tcp://docker:2375 ---'
      DOCKER_HOST=tcp://docker:2375 docker version 2>&1 | tail -3 || true

docker_image:
  stage: image
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  rules:
    # Rebuild only when the image's real inputs change — NOT on CI-file edits
    # (this runner has no dind; rebuilds happen by hand via FORCE_IMAGE_BUILD
    # or from a machine runner with Docker access).
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "Dockerfile"
        - "entrypoint.sh"
        - "init-services.sh"
        - "install.sh"
        - "Migrate.sh"
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - "Dockerfile"
        - "entrypoint.sh"
        - "init-services.sh"
        - "install.sh"
        - "Migrate.sh"
    # ...or by hand: FORCE_IMAGE_BUILD=true (first pipeline of this scheme also
    # needs this once, to seed dev-lab:base in the registry).
    - if: '$FORCE_IMAGE_BUILD == "true"'
      when: manual
      allow_failure: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/dev-lab:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/dev-lab:base" .
    - docker push "$CI_REGISTRY_IMAGE/dev-lab:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/dev-lab:base"
  timeout: 50m

test:
  stage: test
  # Runs on the DEFAULT runner (no tags) — not the laptop container.
  image: "$CI_REGISTRY_IMAGE/dev-lab:base"
  variables:
    # The job container must not run the image's default entrypoint boot
    # (WireGuard/labsctl/systemd) — it only hosts the script, which boots the
    # nested ci-test container. GitLab injects job variables into the
    # container, so this reaches entrypoint.sh.
    DEVLAB_SKIP_BOOT: "1"
    GIT_DEPTH: "1"
  only:
    refs:
      - master
      - merge_requests
    changes:
      - ".gitlab-ci.yml"
      - "labs/**/*.php"
      - "labs/**/*.js"
      - "labs/**/*.scss"
      - "vpn-api/**/*.php"
  timeout: 45m
  script:
    - |
      if [ -z "${ENV_JSON:-}" ]; then
        echo "ENV_JSON file variable is not set — paste local env.json into it"
        echo "(Settings → CI/CD → Variables). The app reads Mongo/mq/mysql creds"
        echo "from it and it is deliberately not committed."
        exit 1
      fi
    # Preflight: what daemon (if any) does this job container see? Without a
    # privileged runner or an injected host socket CI cannot boot ci-test —
    # this makes the failure self-explanatory instead of a bare docker error.
    - echo "[CI] docker access (DOCKER_HOST=${DOCKER_HOST:-<unset default socket>})"
    - ls -l /var/run/docker.sock 2>&1 || echo "[CI] no /var/run/docker.sock"
    - docker version 2>&1 | grep -E 'Server::|ERROR|error|Cannot connect' || true
    # Commit's env.json: keep every real key, but aim database_file at this
    # container's own mongod — the external TomCloudLab_mongodb does not exist
    # in CI. Same mongo_user/mongo_pass that init-services.sh bootstraps.
    - jq '.database_file = "mongodb://\(.mongo_user):\(.mongo_pass)@127.0.0.1:27017/tom_labs_db?authSource=admin"' "$ENV_JSON" > env.json
    # Fresh container per pipeline. Boot scripts are mounted from the commit so
    # a run is always testing what was pushed, not the last image build.
    - docker run -d --privileged --name ci-test
      -v "$PWD/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro"
      -v "$PWD/init-services.sh:/usr/local/bin/init-services.sh:ro"
      -v /var/run/docker.sock:/var/docker.sock
      -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host
      -v "$PWD:/var/www"
      "$CI_REGISTRY_IMAGE/dev-lab:base" >/dev/null
    - echo "[CI] Waiting for init-services to finish inside ci-test…"
    - |
      for i in $(seq 1 120); do
        if docker exec ci-test systemctl is-active --quiet init-services.service 2>/dev/null; then
          echo "[CI] init-services active after ${i}x5s"
          break
        fi
        sleep 5
        [ "$i" = 120 ] && { echo "[CI] container init timed out"; docker logs --tail 100 ci-test; }
      done
    - echo "[CI] Waiting for the dev.tomweb.in vhost on :8083…"
    - |
      for i in $(seq 1 36); do
        CODE=$(docker exec ci-test curl -s -o /dev/null -w '%{http_code}' -H 'Host: dev.tomweb.in' http://localhost:8083/ || echo 000)
        echo "[CI] HTTP $CODE (attempt $i/36)"
        [ "$CODE" != "000" ] && break
        sleep 5
      done
    - docker exec -w /var/www ci-test ./run_tests.sh php || EXIT_CODE=$?
    # run_tests wrote /var/www/test-results — same dir on the job side via the mount
    - test -f test-results/junit.xml && echo "[CI] junit.xml captured"
    - exit ${EXIT_CODE:-0}
  after_script:
    # The disposable container NEVER outlives the job — on pass or fail.
    - docker rm -f ci-test 2>/dev/null || true
  artifacts:
    when: always
    expose_as: 'Test Results'
    paths:
      - test-results/junit.xml
    reports:
      junit: test-results/junit.xml
  allow_failure: false

build:
  stage: build
  # Frontend build in stock node:20 against the commit — no container, no laptop.
  image: node:20-bookworm
  only:
    refs:
      - master
      - merge_requests
    changes:
      - ".gitlab-ci.yml"
      - "labs/workspace/**/*"
      - "labs/htdocs/assets/**/*"
  script:
    - node -v
    - cd labs/workspace/grunt
    - npm ci --no-audit --no-fund
    - npx grunt build
    - cd ../../..
    - test -f labs/htdocs/assets/css/app.css
    - test -f labs/htdocs/assets/js/app.js
    - test -f labs/htdocs/assets/js/app.min.js

deploy:
  stage: deploy
  tags:
    - shared
  only:
    refs:
      - master
    changes:
      - ".gitlab-ci.yml"
      - "labs/**/*"
      - "vpn-api/**/*"
      - "opt/**/*"
      - "session.json"
      - "init-services.sh"
      - "entrypoint.sh"
  dependencies:
    - test
    - build
  script:
    - git describe --tags --always > labs/.version
    - rsync -av --delete --exclude vendor --exclude node_modules labs/ /Users/sathish/Downloads/TomCloudLab/labs/
    - rsync -av --delete --exclude vendor --exclude node_modules vpn-api/ /Users/sathish/Downloads/TomCloudLab/vpn-api/
    - rsync -av --delete --exclude labs-control-panel/config.json opt/ /Users/sathish/Downloads/TomCloudLab/opt/
    - cp session.json /Users/sathish/Downloads/TomCloudLab/session.json
    - cp init-services.sh /Users/sathish/Downloads/TomCloudLab/init-services.sh
    - cp entrypoint.sh /Users/sathish/Downloads/TomCloudLab/entrypoint.sh
    - cp run_tests.sh /Users/sathish/Downloads/TomCloudLab/run_tests.sh
  environment:
    name: production
    url: https://labs.tomweb.in
