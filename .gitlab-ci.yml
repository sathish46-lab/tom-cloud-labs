stages:
  - scan
  - test
  - build
  - deploy

scan:
  stage: scan
  tags:
    - production
  only:
    refs:
      - master
      - merge_requests
  script:
    - rm -rf labsstorage/ vendor/ vpn-api/vendor/ backups/ node_modules/
    - gitleaks detect --source . --no-git --redact --report-path /tmp/gitlab-gitleaks.json
  allow_failure: false

test:
  stage: test
  tags:
    - production
  only:
    refs:
      - master
      - merge_requests
    changes:
      - ".gitlab-ci.yml"
      - "labs/**/*.php"
      - "labs/**/*.js"
      - "labs/**/*.scss"
      - "vpn-api/**/*.php"
  script:
    - mkdir -p test-results
    - docker exec -w /var/www Dev_lab ./run_tests.sh php || EXIT_CODE=$?
    - docker exec Dev_lab cat /var/www/test-results/junit.xml > test-results/junit.xml || true
    - exit ${EXIT_CODE:-0}
  artifacts:
    when: always
    expose_as: 'Test Results'
    paths:
      - test-results/junit.xml
    reports:
      junit: test-results/junit.xml
  allow_failure: false

build:
  stage: build
  tags:
    - production
  only:
    refs:
      - master
    changes:
      - ".gitlab-ci.yml"
      - "labs/workspace/**/*"
      - "labs/htdocs/assets/**/*"
  script:
    - docker exec -w /var/www/labs/workspace/grunt Dev_lab bash -c "npm install && npx grunt build"
    - test -f labs/htdocs/assets/css/app.css
    - test -f labs/htdocs/assets/js/app.js
    - test -f labs/htdocs/assets/js/app.min.js

deploy:
  stage: deploy
  tags:
    - production
  only:
    refs:
      - master
    changes:
      - ".gitlab-ci.yml"
      - "labs/**/*"
      - "vpn-api/**/*"
      - "opt/**/*"
      - "session.json"
      - "init-services.sh"
      - "entrypoint.sh"
  dependencies:
    - test
    - build
  script:
    - git describe --tags --always > labs/.version
    - rsync -av --delete --exclude vendor --exclude node_modules labs/ /Users/sathish/Downloads/TomCloudLab/labs/
    - rsync -av --delete --exclude vendor --exclude node_modules vpn-api/ /Users/sathish/Downloads/TomCloudLab/vpn-api/
    - rsync -av --delete --exclude labs-control-panel/config.json opt/ /Users/sathish/Downloads/TomCloudLab/opt/
    - cp session.json /Users/sathish/Downloads/TomCloudLab/session.json
    - cp init-services.sh /Users/sathish/Downloads/TomCloudLab/init-services.sh
    - cp entrypoint.sh /Users/sathish/Downloads/TomCloudLab/entrypoint.sh
    - cp run_tests.sh /Users/sathish/Downloads/TomCloudLab/run_tests.sh
  environment:
    name: production
    url: https://labs.tomweb.in
