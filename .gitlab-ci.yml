# ============================================================================
# Lightweight CI — gitleaks scan → deploy to the laptop target.
#
#   scan   → gitleaks (fails the pipeline on a leak)
#   image  → docker_probe / docker_image (MANUAL only, optional buttons)
#   build  → grunt frontend build — KEPT but SKIPPED (rules: never). Assets
#            are built locally (grunt) and shipped by deploy with labs/.
#   deploy → rsync labs/, vpn-api/, opt/ to /Users/sathish/Downloads/TomCloudLab
#            on the shared (laptop) runner. Re-enabled after scan passes.
#
# The test job (isolated per-commit container boot) is REMOVED for now —
# common-runner has no docker daemon. Restore it from git history when a
# privileged runner exists. ENV_JSON CI variable stays set, unused for now.
#
# One-time setup (already done): ENV_JSON (File, redacted, never committed).
# ============================================================================

stages:
  - scan
  - image
  - build
  - deploy

scan:
  stage: scan
  tags:
    - shared
  only:
    refs:
      - master
      - merge_requests
  script:
    # 1. Clean out heavy, non-source directories to optimize gitleaks speed
    - rm -rf labsstorage/ vendor/ vpn-api/vendor/ backups/ node_modules/
    # 2. Install curl and download gitleaks binary from GitHub releases
    - apt-get update -qq && apt-get install -y -qq curl tar
    - curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /usr/local/bin
    # 3. Run gitleaks on current source tree only (no git history scan)
    - gitleaks detect --source . --no-git --redact --report-path /tmp/gitlab-gitleaks.json
  allow_failure: false

docker_probe:
  # Manual diagnostic: what docker access does the instance runner really have?
  # Run it during the pipeline if docker jobs fail to connect to a daemon.
  stage: image
  image: docker:cli
  when: manual
  allow_failure: true
  script:
    - |
      echo '--- docker env vars ---'
      env | grep -iE 'docker|ci_registry' || true
      echo '--- probe default docker socket (DOCKER_HOST unset) ---'
      unset DOCKER_HOST
      ls -l /var/run/docker.sock 2>&1 || true
      docker info 2>&1 | grep -E 'Server Version|Operating System|ERROR|error' || true
      echo '--- probe dind service tcp://docker:2375 ---'
      DOCKER_HOST=tcp://docker:2375 docker version 2>&1 | tail -3 || true

docker_image:
  stage: image
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  allow_failure: true
  # MANUAL on this runner: it has no dind (services crash at start), so the
  # base image is built+pushed by hand from a machine with Docker (Docker Lab)
  # whenever the inputs below change. The job stays a clickable button.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      changes:
        - "Dockerfile"
        - "entrypoint.sh"
        - "init-services.sh"
        - "install.sh"
        - "Migrate.sh"
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      changes:
        - "Dockerfile"
        - "entrypoint.sh"
        - "init-services.sh"
        - "install.sh"
        - "Migrate.sh"
    - if: '$FORCE_IMAGE_BUILD == "true"'
      when: manual
      changes:
        - "**/*"
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      changes:
        - "**/*"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/dev-lab:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/dev-lab:base" .
    - docker push "$CI_REGISTRY_IMAGE/dev-lab:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/dev-lab:base"
  timeout: 50m

build:
  stage: build
  # SKIPPED for now (was: node:20 + grunt build). Assets are built locally
  # with Grunt and deployed together with labs/. To re-enable, replace the
  # rules below with:
  #   only:
  #     refs: [master, merge_requests]
  #     changes:
  #       - ".gitlab-ci.yml"
  #       - "labs/workspace/**/*"
  #       - "labs/htdocs/assets/**/*"
  rules:
    - when: never
  image: node:20-bookworm
  script:
    - node -v
    - cd labs/workspace/grunt
    - npm ci --no-audit --no-fund
    - npx grunt build
    - cd ../../..
    - test -f labs/htdocs/assets/css/app.css
    - test -f labs/htdocs/assets/js/app.js
    - test -f labs/htdocs/assets/js/app.min.js

deploy:
  stage: deploy
  tags:
    - shared
  only:
    refs:
      - master
    changes:
      - ".gitlab-ci.yml"
      - "labs/**/*"
      - "vpn-api/**/*"
      - "opt/**/*"
      - "session.json"
      - "init-services.sh"
      - "entrypoint.sh"
  script:
    # ubuntu:latest has neither git nor rsync — deploy needs both
    - apt-get update -qq && apt-get install -y -qq git rsync >/dev/null
    - git describe --tags --always > labs/.version
    - rsync -av --delete --exclude vendor --exclude node_modules labs/ /Users/sathish/Downloads/TomCloudLab/labs/
    - rsync -av --delete --exclude vendor --exclude node_modules vpn-api/ /Users/sathish/Downloads/TomCloudLab/vpn-api/
    - rsync -av --delete --exclude labs-control-panel/config.json opt/ /Users/sathish/Downloads/TomCloudLab/opt/
    - cp session.json /Users/sathish/Downloads/TomCloudLab/session.json
    - cp init-services.sh /Users/sathish/Downloads/TomCloudLab/init-services.sh
    - cp entrypoint.sh /Users/sathish/Downloads/TomCloudLab/entrypoint.sh
    - cp run_tests.sh /Users/sathish/Downloads/TomCloudLab/run_tests.sh
  environment:
    name: production
    url: https://labs.tomweb.in
