services:
  # ===========================================================================
  # vps — app + SSH + WireGuard (ONLY container with WG port open)
  # ===========================================================================
  vps:
    image: dev_lab:latest
    container_name: ${VPS_CONTAINER:-vps}
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - apparmor:unconfined
    environment:
      # Domains are per-environment — REQUIRED in .env (no defaults in code,
      # so the same compose file serves dev / prod / CI without drift)
      - MAIN_DOMAIN=${MAIN_DOMAIN:?Set MAIN_DOMAIN in .env}
      - VPN_DOMAIN=${VPN_DOMAIN:?Set VPN_DOMAIN in .env}
      - MQS_DOMAIN=${MQS_DOMAIN:?Set MQS_DOMAIN in .env}
      - CODE_DOMAIN=${CODE_DOMAIN:?Set CODE_DOMAIN in .env}
      - SSL_EMAIL=${SSL_EMAIL:-admin@example.com}
      # Force X-Forwarded-Proto=https at Apache (prod: behind Cloudflare TLS).
      # Dev HTTP mode sets false in .env so session cookies stay non-Secure.
      - FORCE_XFP_HTTPS=${FORCE_XFP_HTTPS:-true}
      - CONTACT_ADMIN_EMAIL=${CONTACT_ADMIN_EMAIL:-contact@tomweb.in}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-contact@tomweb.in}
      - DOCKER_HOST=unix:///var/docker.sock
      - WIREGUARD_MODE=${WIREGUARD_MODE:-docker}
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASS=${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env file}
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASS=${MONGO_PASS:?Set MONGO_PASS in .env file}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-${MONGO_PASS}}
      # Point app at split service containers (NOT localhost anymore)
      # Point app at split service containers (NOT localhost anymore)
      - DATABASE_FILE=mongodb://tomapp:${PRODMONGO_APP_PASS:?Set PRODMONGO_APP_PASS in .env}@prodmongo.tomweb.in:27017/tom_labs_db?authSource=tom_labs_db
      - MCP_MONGO_PASS=${MCP_MONGO_PASS:?Set MCP_MONGO_PASS in .env}
      - MYSQL_HOST=mysql.tomweb.in
      - MYSQL_PORT=3306
      - POSTGRES_HOST=postgres.tomweb.in
      - POSTGRES_PORT=5432
      - REDIS_HOST=prodredis.tomweb.in
      - REDIS_PORT=6379
      - REDIS_PASS=${REDIS_PASS:?Set REDIS_PASS in .env}
      - API_SECRET=${API_SECRET:?Set API_SECRET in .env}
      - AI_INTERNAL_TOKEN=${AI_INTERNAL_TOKEN:?Set AI_INTERNAL_TOKEN in .env}
      - AI_API_KEY=${AI_API_KEY:-}
    extra_hosts:
      # Internal .tomweb.in DNS → fixed service IPs
      - "mysql.tomweb.in:10.20.208.16"
      - "postgres.tomweb.in:10.20.208.17"
      - "redis.tomweb.in:10.20.208.18"
      - "adminer.tomweb.in:10.20.208.19"
      - "mongo.tomweb.in:10.20.208.20"
      - "prodmongo.tomweb.in:10.20.209.10"
      - "prodredis.tomweb.in:10.20.209.11"
      - "mariadb.tomweb.in:10.20.208.26"
      - "dev.tomweb.in:127.0.0.1"
      - "vpn.dev.tomweb.in:127.0.0.1"
      - "mq.dev.tomweb.in:10.20.208.24"
      - "code.dev.tomweb.in:127.0.0.1"
      - "labs.tomweb.in:127.0.0.1"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - .:/var/www
      # Boot scripts mounted from source so edits apply without image rebuilds
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./init-services.sh:/usr/local/bin/init-services.sh
      - /var/run/docker.sock:/var/docker.sock
      - ./opt/labs-control-panel:/opt/labs-control-panel
      - devlab-wireguard-conf:/etc/wireguard
      - traefik-conf-data:/etc/traefik
      - devlab-storage:/var/tomlabs/storage
    depends_on:
      prodmongo:
        condition: service_healthy
      prodredis:
        condition: service_healthy
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.10
      labs_backend:
        aliases:
          - mysql.tomweb.in
          - adminer.tomweb.in
          - mongo.tomweb.in
          - code.tomweb.in
          - tomweb.shop
          - mq.tomweb.in
          - work.tomweb.in
          - labs.tomweb.in
      labs_frontend: {}
      prod_internal:
        ipv4_address: 10.20.209.20
    ports:
      - "${HTTP_PORT:-9080}:80"
      - "${HTTPS_PORT:-9443}:443"
      - "127.0.0.1:${MQS_PORT:-9081}:8081"
      - "127.0.0.1:${MQS_MGMT_PORT:-9082}:8082"
      - "${WG_PORT:-51821}:51820/udp"
      - "51822:51820/udp"
      - "${SSH_PORT:-2222}:22"
    stop_signal: SIGRTMIN+3

  # ===========================================================================
  # prodredis.tomweb.in — 10.20.209.11 (private, platform data only)
  # ===========================================================================
  prodredis:
    image: ${PRODREDIS_IMAGE:-redis:7-alpine}
    container_name: prodredis.tomweb.in
    command: ["redis-server", "--requirepass", "${REDIS_PASS}"]
    environment:
      REDIS_PASS: ${REDIS_PASS:?Set REDIS_PASS in .env}
    volumes:
      - devlab-redis:/data
    networks:
      prod_internal:
        ipv4_address: 10.20.209.11
        aliases:
          - prodredis.tomweb.in
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ===========================================================================
  # prodmongo.tomweb.in — 10.20.209.10 (private, platform data only)
  # ===========================================================================
  prodmongo:
    image: ${PRODMONGO_IMAGE:-mongo:8.0}
    container_name: prodmongo.tomweb.in
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${PRODMONGO_ROOT_PASS:?Set PRODMONGO_ROOT_PASS in .env}
    volumes:
      - devlab-mongo:/data/db
    networks:
      prod_internal:
        ipv4_address: 10.20.209.10
        aliases:
          - prodmongo.tomweb.in
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===========================================================================
  # mysql.tomweb.in — 10.20.208.16 (internal only, not published to host)
  # ===========================================================================
  mysql:
    image: mysql:8.0
    container_name: mysql.tomweb.in
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tomcloud}
      MYSQL_USER: ${MYSQL_USER:-tomcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-service-data:/var/lib/mysql
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.16
    restart: unless-stopped

  # ===========================================================================
  # postgres.tomweb.in — 10.20.208.17
  # Built from service-templates/postgresql (latest PostgreSQL image + lab tuning)
  # ===========================================================================
  postgres:
    image: postgres:17
    container_name: postgres.tomweb.in
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tomcloud}
    volumes:
      - postgres-service-data:/var/lib/postgresql/data
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.17
        aliases:
          - postgres.tomweb.in
          - postgresql.tomweb.in
    restart: unless-stopped

  # ===========================================================================
  # redis.tomweb.in — 10.20.208.18
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: redis.tomweb.in
    command: redis-server --save "" --appendonly no
    volumes:
      - redis-service-data:/data
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.18
    restart: unless-stopped

  # ===========================================================================
  # adminer.tomweb.in — 10.20.208.19
  # ===========================================================================
  adminer:
    build: ./opt/labs-control-panel/service-templates/adminer
    image: tomcloud/adminer-mongo:latest
    container_name: adminer.tomweb.in
    environment:
      ADMINER_DEFAULT_SERVER: mysql.tomweb.in
      # MongoDB users are created in the admin db by the service engine
      MONGO_AUTH_SOURCE: admin
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.19
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    restart: unless-stopped

  # ===========================================================================
  # mongo.tomweb.in — 10.20.208.20 (separate app-data MongoDB service)
  # ===========================================================================
  mongo:
    image: mongo:8.0
    container_name: mongo.tomweb.in
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-service-data:/data/db
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.20
        aliases:
          - mongo.tomweb.in
          - mongodb.tomweb.in
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped

  # ===========================================================================
  # mongo-express — web UI for mongo.tomweb.in (host-local only, no public DNS)
  # ===========================================================================
  mongo-express:
    image: mongo-express:latest
    container_name: mongoexpress.tomweb.in
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo.tomweb.in
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-tomadmin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASS:?Set ME_PASS in .env}
      ME_CONFIG_OPTIONS_EDITORTHEME: default
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.21
    ports:
      - "127.0.0.1:${ME_PORT:-8085}:8081"
    depends_on:
      - mongo
    restart: unless-stopped

  # ===========================================================================
  # svcguard — friendly front door for native DB ports (browser port-forwards)
  # HTTP request on a guard port -> HTML warning page; native clients are
  # piped through transparently to the real service. MongoDB is not guarded
  # (mongod serves its own HTTP warning on 27017). Out of the engine's hot
  # path: services stay reachable directly if this container is down.
  # ===========================================================================
  svcguard:
    image: python:3.12-alpine
    container_name: svcguard.tomweb.in
    volumes:
      - ./opt/labs-control-panel/service-templates/svcguard/guard.py:/guard.py:ro
    command: ["python", "-u", "/guard.py"]
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.22
        aliases:
          - svcguard.tomweb.in
    depends_on:
      - postgres
      - redis
      - memcached
    restart: unless-stopped

  # ===========================================================================
  # memcached — 10.20.208.23 (separate user service container)
  # Native wire protocol; browsers get the friendly page via svcguard:11221.
  # ===========================================================================
  memcached:
    image: memcached:alpine
    container_name: memcached.tomweb.in
    command: ["-m", "64"]
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.25
        aliases:
          - memcached.tomweb.in
    restart: unless-stopped

  # ===========================================================================
  # mariadb.tomweb.in — 10.20.208.26 (split out of the vps; port 3307 to match UI)
  # ===========================================================================
  mariadb:
    image: mariadb:10.11
    container_name: mariadb.tomweb.in
    command: ["--port=3307"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env file}
    volumes:
      - mariadb-service-data:/var/lib/mysql
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.26
        aliases:
          - mariadb.tomweb.in
    restart: unless-stopped

  # ===========================================================================
  # rabbitmq — 10.20.208.24 (split out of the vps; persistent data volume)
  # Management UI is a real web app; svcguard does NOT proxy it. Apache on the
  # vps still fronts mq.tomweb.in (management UI + STOMP /ws) for the tunnel.
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq.tomweb.in
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env}
    volumes:
      - rabbitmq-service-data:/var/lib/rabbitmq
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.24
        aliases:
          - rabbitmq.tomweb.in
    ports:
      - "127.0.0.1:${RABBIT_PORT:-5672}:5672"
      - "127.0.0.1:${RABBIT_MGMT_PORT:-15672}:15672"
      - "127.0.0.1:${RABBIT_MGMT_EXTRA_PORT:-15674}:15674"
    restart: unless-stopped

  # ===========================================================================
  # cloudflared / ddns-updater (prod only) — keep on existing backend net
  # ===========================================================================
  cloudflared:
    profiles:
      - prod
    image: cloudflare/cloudflared:latest
    container_name: ${CLOUDFLARED_CONTAINER:-TomCloudLab_cloudflared}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    networks:
      - ${BACKEND_NET:-TomCloudLab_backend}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  ddns-updater:
    profiles:
      - prod
    image: oznu/cloudflare-ddns:latest
    container_name: ${DDNS_CONTAINER:-TomCloudLab_ddns_updater}
    restart: unless-stopped
    environment:
      - API_KEY=${CF_API_KEY:-}
      - ZONE=${DDNS_ZONE:-tomweb.in}
      - SUBDOMAIN=${DDNS_SUBDOMAIN:-vpn}
      - PROXIED=${DDNS_PROXIED:-false}
      - RRTYPE=A
      - CHECK_INTERVAL=60
    networks:
      - ${BACKEND_NET:-TomCloudLab_backend}

  # Legacy external app-data MongoDB — disabled by default
  mongodb:
    profiles:
      - legacy-extmongo
    image: mongo:8.0
    container_name: TomCloudLab_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-${MONGO_PASS:?Set MONGO_PASS in .env}}
    volumes:
      - ./mongo-data:/data/db
    networks:
      - ${BACKEND_NET:-TomCloudLab_backend}
    ports:
      - "127.0.0.1:27018:27017"
    restart: always

networks:
  tomweb_services:
    name: tomweb_services
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.208.0/24

  labs_backend:
    name: ${BACKEND_NET:-dev_backend}
    driver: bridge

  labs_frontend:
    name: labs_frontend
    external: true

  prod_internal:
    name: prod_internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.20.209.0/24

volumes:
  devlab-mongo:
    name: devlab-mongo
    external: true
  devlab-redis:
    name: devlab-redis
    external: true
  redis-service-data:
    name: redis-service-data
    external: true
  postgres-service-data:
    name: postgres-service-data
    external: true
  mysql-service-data:
    name: mysql-service-data
    external: true
  mariadb-service-data:
    name: mariadb-service-data
    external: true
  rabbitmq-service-data:
    name: rabbitmq-service-data
    external: true
  mongo-service-data:
    name: mongo-service-data
    external: true
  traefik-conf-data:
    name: traefik-conf-data
    external: true
  devlab-storage:
    name: devlab-storage
    external: true
  devlab-wireguard-conf:
    name: devlab-wireguard-conf
    external: true
