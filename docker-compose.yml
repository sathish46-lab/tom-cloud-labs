services:
  # ===========================================================================
  # vps — app + SSH + WireGuard (ONLY container with WG port open)
  # ===========================================================================
  vps:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${VPS_CONTAINER:-vps}
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - apparmor:unconfined
    environment:
      - MAIN_DOMAIN=${MAIN_DOMAIN:-labs.tomweb.in}
      - VPN_DOMAIN=${VPN_DOMAIN:-vpn.dev.tomweb.in}
      - MQS_DOMAIN=${MQS_DOMAIN:-mq.dev.tomweb.in}
      - CODE_DOMAIN=${CODE_DOMAIN:-code.dev.tomweb.in}
      - WORK_DOMAIN=${WORK_DOMAIN:-work.tomweb.in}
      - NEWS_DOMAIN=${NEWS_DOMAIN:-news.tomweb.in}
      - SSL_EMAIL=${SSL_EMAIL:-admin@example.com}
      - CONTACT_ADMIN_EMAIL=${CONTACT_ADMIN_EMAIL:-contact@tomweb.in}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-contact@tomweb.in}
      - DOCKER_HOST=unix:///var/docker.sock
      - WIREGUARD_MODE=${WIREGUARD_MODE:-docker}
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASS=${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env file}
      - MONGO_USER=${MONGO_USER:-admin}
      - MONGO_PASS=${MONGO_PASS:?Set MONGO_PASS in .env file}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-${MONGO_PASS}}
      # Point app at split service containers (NOT localhost anymore)
      # Point app at split service containers (NOT localhost anymore)
      - DATABASE_FILE=mongodb://admin:Tombootroot@127.0.0.1:27017/tom_labs_db?authSource=admin
      - MYSQL_HOST=mysql.tomweb.in
      - MYSQL_PORT=3306
      - POSTGRES_HOST=postgres.tomweb.in
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis.tomweb.in
      - REDIS_PORT=6379
      - API_SECRET=${API_SECRET:-your-super-secret-token-here}
      - AI_INTERNAL_TOKEN=${AI_INTERNAL_TOKEN:-tclabs_ai_tool_92d3f8a1b5c7e4}
      - AI_API_KEY=${AI_API_KEY:-}
    extra_hosts:
      # Internal .tomweb.in DNS → fixed service IPs
      - "mysql.tomweb.in:10.20.208.16"
      - "postgres.tomweb.in:10.20.208.17"
      - "redis.tomweb.in:10.20.208.18"
      - "adminer.tomweb.in:10.20.208.19"
      - "mongo.tomweb.in:10.20.208.20"
      - "mariadb.tomweb.in:10.20.208.26"
      - "dev.tomweb.in:127.0.0.1"
      - "vpn.dev.tomweb.in:127.0.0.1"
      - "mq.dev.tomweb.in:127.0.0.1"
      - "code.dev.tomweb.in:127.0.0.1"
      - "work.dev.tomweb.in:127.0.0.1"
      - "news.dev.tomweb.in:127.0.0.1"
      - "labs.tomweb.in:127.0.0.1"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - .:/var/www
      # Boot scripts mounted from source so edits apply without image rebuilds
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./init-services.sh:/usr/local/bin/init-services.sh
      - /var/run/docker.sock:/var/docker.sock
      - ./opt/labs-control-panel:/opt/labs-control-panel
      - ./wireguard-conf:/etc/wireguard
      - ./apache-logs:/var/log/apache2
      - ./traefik-conf:/etc/traefik
      - ./tomlabs/storage:/var/tomlabs/storage
      # App-data MongoDB lives INSIDE the container (mongod, /etc/mongod.conf)
      - ./mongo-data:/var/lib/mongodb
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.10
      labs_backend:
        aliases:
          - mysql.tomweb.in
          - adminer.tomweb.in
          - mongo.tomweb.in
          - code.tomweb.in
          - tomweb.shop
          - mq.tomweb.in
          - work.tomweb.in
          - labs.tomweb.in
      labs_frontend: {}
    ports:
      - "${HTTP_PORT:-9080}:80"
      - "${HTTPS_PORT:-9443}:443"
      - "127.0.0.1:${MQS_PORT:-9081}:8081"
      - "127.0.0.1:${MQS_MGMT_PORT:-9082}:8082"
      - "${WG_PORT:-51821}:51820/udp"
      - "51822:51820/udp"
      - "${SSH_PORT:-2222}:22"
    stop_signal: SIGRTMIN+3

  # ===========================================================================
  # mysql.tomweb.in — 10.20.208.16 (internal only, not published to host)
  # ===========================================================================
  mysql:
    image: mysql:8.0
    container_name: mysql.tomweb.in
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tomcloud}
      MYSQL_USER: ${MYSQL_USER:-tomcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tomcloud}
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.16
    restart: unless-stopped

  # ===========================================================================
  # postgres.tomweb.in — 10.20.208.17
  # Built from service-templates/postgresql (latest PostgreSQL image + lab tuning)
  # ===========================================================================
  postgres:
    build:
      context: ./opt/labs-control-panel/service-templates/postgresql
      args:
        POSTGRES_VERSION: 17
    image: tomcloud/postgresql:17
    container_name: postgres.tomweb.in
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tomcloud}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.17
        aliases:
          - postgres.tomweb.in
          - postgresql.tomweb.in
    restart: unless-stopped

  # ===========================================================================
  # redis.tomweb.in — 10.20.208.18
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: redis.tomweb.in
    command: redis-server --save "" --appendonly no
    volumes:
      - ./redis-data:/data
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.18
    restart: unless-stopped

  # ===========================================================================
  # adminer.tomweb.in — 10.20.208.19
  # ===========================================================================
  adminer:
    build: ./opt/labs-control-panel/service-templates/adminer
    image: tomcloud/adminer-mongo:latest
    container_name: adminer.tomweb.in
    environment:
      ADMINER_DEFAULT_SERVER: mysql.tomweb.in
      # MongoDB users are created in the admin db by the service engine
      MONGO_AUTH_SOURCE: admin
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.19
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    restart: unless-stopped

  # ===========================================================================
  # mongo.tomweb.in — 10.20.208.20 (separate app-data MongoDB service)
  # ===========================================================================
  mongo:
    image: mongo:8.0
    container_name: mongo.tomweb.in
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-Tombootroot}
    volumes:
      - ./mongo-service-data:/data/db
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.20
        aliases:
          - mongo.tomweb.in
          - mongodb.tomweb.in
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped

  # ===========================================================================
  # mongo-express — web UI for mongo.tomweb.in (host-local only, no public DNS)
  # ===========================================================================
  mongo-express:
    image: mongo-express:latest
    container_name: mongoexpress.tomweb.in
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo.tomweb.in
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-Tombootroot}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-tomadmin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASS:-express@2026}
      ME_CONFIG_OPTIONS_EDITORTHEME: default
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.21
    ports:
      - "127.0.0.1:${ME_PORT:-8085}:8081"
    depends_on:
      - mongo
    restart: unless-stopped

  # ===========================================================================
  # svcguard — friendly front door for native DB ports (browser port-forwards)
  # HTTP request on a guard port -> HTML warning page; native clients are
  # piped through transparently to the real service. MongoDB is not guarded
  # (mongod serves its own HTTP warning on 27017). Out of the engine's hot
  # path: services stay reachable directly if this container is down.
  # ===========================================================================
  svcguard:
    image: python:3.12-alpine
    container_name: svcguard.tomweb.in
    volumes:
      - ./opt/labs-control-panel/service-templates/svcguard/guard.py:/guard.py:ro
    command: ["python", "-u", "/guard.py"]
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.22
        aliases:
          - svcguard.tomweb.in
    depends_on:
      - postgres
      - redis
      - memcached
    restart: unless-stopped

  # ===========================================================================
  # memcached — 10.20.208.23 (separate user service container)
  # Native wire protocol; browsers get the friendly page via svcguard:11221.
  # ===========================================================================
  memcached:
    image: memcached:alpine
    container_name: memcached.tomweb.in
    command: ["-m", "64"]
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.25
        aliases:
          - memcached.tomweb.in
    restart: unless-stopped

  # ===========================================================================
  # mariadb.tomweb.in — 10.20.208.26 (split out of the vps; port 3307 to match UI)
  # ===========================================================================
  mariadb:
    image: mariadb:10.11
    container_name: mariadb.tomweb.in
    command: ["--port=3307"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env file}
    volumes:
      - ./mariadb-service-data:/var/lib/mysql
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.26
        aliases:
          - mariadb.tomweb.in
    restart: unless-stopped

  # ===========================================================================
  # rabbitmq — 10.20.208.24 (split out of the vps; persistent data volume)
  # Management UI is a real web app; svcguard does NOT proxy it. Apache on the
  # vps still fronts mq.tomweb.in (management UI + STOMP /ws) for the tunnel.
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq.tomweb.in
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    volumes:
      - ./rabbitmq-service-data:/var/lib/rabbitmq
    networks:
      tomweb_services:
        ipv4_address: 10.20.208.24
        aliases:
          - rabbitmq.tomweb.in
    ports:
      - "127.0.0.1:${RABBIT_PORT:-5672}:5672"
      - "127.0.0.1:${RABBIT_MGMT_PORT:-15672}:15672"
      - "127.0.0.1:${RABBIT_MGMT_EXTRA_PORT:-15674}:15674"
    restart: unless-stopped

  # ===========================================================================
  # cloudflared / ddns-updater (prod only) — keep on existing backend net
  # ===========================================================================
  cloudflared:
    profiles:
      - prod
    image: cloudflare/cloudflared:latest
    container_name: ${CLOUDFLARED_CONTAINER:-TomCloudLab_cloudflared}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    networks:
      - ${BACKEND_NET:-TomCloudLab_backend}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  ddns-updater:
    profiles:
      - prod
    image: oznu/cloudflare-ddns:latest
    container_name: ${DDNS_CONTAINER:-TomCloudLab_ddns_updater}
    restart: unless-stopped
    environment:
      - API_KEY=${CF_API_KEY:-}
      - ZONE=${DDNS_ZONE:-tomweb.in}
      - SUBDOMAIN=${DDNS_SUBDOMAIN:-vpn}
      - PROXIED=${DDNS_PROXIED:-false}
      - RRTYPE=A
      - CHECK_INTERVAL=60
    networks:
      - ${BACKEND_NET:-TomCloudLab_backend}

  # Legacy external app-data MongoDB — disabled by default
  mongodb:
    profiles:
      - legacy-extmongo
    image: mongo:8.0
    container_name: TomCloudLab_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-${MONGO_PASS:?Set MONGO_PASS in .env}}
    volumes:
      - ./mongo-data:/data/db
    networks:
      - ${BACKEND_NET:-TomCloudLab_backend}
    ports:
      - "127.0.0.1:27018:27017"
    restart: always

networks:
  tomweb_services:
    name: tomweb_services
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.208.0/24

  labs_backend:
    name: ${BACKEND_NET:-dev_backend}
    driver: bridge

  labs_frontend:
    name: labs_frontend
    external: true

volumes:
  labsstorage:
    name: labsstorage
    external: true
